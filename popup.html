<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Verlopen favorieten</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 300px;
    padding: 16px;
    margin: 0;
    color: #1a1a1a;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #ff6600;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  button:disabled {
    background: #ccc;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #444;
    min-height: 16px;
  }
  #resultList {
    margin: 8px 0 0;
    padding-left: 18px;
    font-size: 12px;
    color: #555;
    max-height: 160px;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <h1>Marktplaats favorieten</h1>
  <button id="startBtn">Verwijder verlopen favorieten</button>
  <div id="status"></div>
  <ul id="resultList"></ul>
  <script src="popup.js"></script>
</body>
</html>
