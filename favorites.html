<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mijn favorieten - Marktplaats Tweaks</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #15171c;
    color: #f2f3f5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo {
    width: 32px; height: 32px; border-radius: 8px; background: #ff7a1a; color: #15171c;
    font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  h1 { margin: 0; font-size: 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  input[type="search"], select {
    background: #1f222a; color: #f2f3f5; border: 1px solid #2c303a; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; font-family: inherit;
  }
  input[type="search"] { flex: 1 1 220px; min-width: 0; }
  button {
    background: #ff7a1a; color: #15171c; border: none; border-radius: 8px; padding: 9px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #3a3f4b; color: #a8adb8; cursor: default; }
  button.secondary { background: #1f222a; color: #f2f3f5; border: 1px solid #2c303a; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .meta { font-size: 13px; color: #a8adb8; margin: 10px 0 18px; min-height: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; background: #1f222a; border: 1px solid #2c303a;
    border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none;
  }
  .card:hover { border-color: #ff7a1a; }
  .thumb { aspect-ratio: 4 / 3; background: #2a2e38; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 8px; left: 8px; background: #15171c; color: #ffb27a;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid #ff7a1a;
  }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .price { font-weight: 700; font-size: 15px; }
  .title {
    font-size: 13px; color: #d4d7de; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card.expired .thumb img { opacity: .45; }
  .empty { text-align: center; color: #a8adb8; padding: 60px 0; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo" aria-hidden="true">M</div>
      <h1>Mijn favorieten</h1>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Zoek in je favorieten" aria-label="Zoek in je favorieten" />
      <select id="filter" aria-label="Filter">
        <option value="all">Alles</option>
        <option value="active">Actief</option>
        <option value="expired">Verlopen</option>
      </select>
      <select id="sort" aria-label="Sorteren">
        <option value="recent">Nieuwst opgeslagen</option>
        <option value="oldest">Oudst opgeslagen</option>
        <option value="title">Titel A-Z</option>
        <option value="priceAsc">Prijs laag naar hoog</option>
        <option value="priceDesc">Prijs hoog naar laag</option>
      </select>
      <button id="syncBtn">Synchroniseer</button>
      <button id="clearBtn" class="secondary">Wis lijst</button>
    </div>
    <div class="meta" id="meta" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <script src="favorites.js"></script>
</body>
</html>
