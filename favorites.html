<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mijn favorieten - Marktplaats Tweaks</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #e0e0e0;
  }
  .layout { display: flex; flex-wrap: wrap; min-height: 100vh; }

  /* Zijbalk met filters */
  .side {
    flex: 0 0 240px;
    padding: 28px 20px;
    background: #1a1a1a;
    border-right: 1px solid #2c2c2c;
  }
  .side h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .side-h {
    font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
    color: #a0a0a0; margin: 22px 0 8px;
  }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 5px 0; cursor: pointer; accent-color: #e8873f; }
  .opt.on { font-weight: 700; }
  .field {
    width: 100%; background: #121212; color: #e0e0e0; border: 1px solid #333; border-radius: 8px;
    padding: 9px 10px; font-size: 14px; font-family: inherit;
  }
  .range { display: flex; gap: 8px; }
  .range .field { width: 50%; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px;
    padding: 10px 14px; border: 1px solid transparent;
  }
  button:disabled { background: #333; color: #a0a0a0; cursor: default; }
  .primary { background: #e8873f; color: #121212; }
  .secondary { background: transparent; color: #e0e0e0; border-color: #333; }
  .outline { background: transparent; color: #e8873f; border-color: #e8873f; padding: 7px 12px; font-size: 13px; }
  .side button { width: 100%; }
  .side .primary { margin-top: 24px; }
  .side .secondary { margin-top: 8px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* Hoofdgedeelte */
  .main { flex: 1 1 520px; min-width: 0; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 600; flex-grow: 1; }
  .top .field { width: 240px; max-width: 100%; }
  .meta { font-size: 13px; color: #a0a0a0; min-height: 18px; }
  .section-h {
    display: flex; align-items: center; gap: 10px; margin-top: 6px;
    font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
  }
  .section-h.expired { color: #a0a0a0; margin-top: 12px; }
  .cnt {
    font-size: 12px; font-weight: 700; background: #2c2c2c; color: #e0e0e0;
    padding: 2px 9px; border-radius: 999px; letter-spacing: 0;
  }
  .section-h .outline { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; background: #1e1e1e; border: 1px solid #2c2c2c;
    border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none;
  }
  .card:hover { border-color: #e8873f; }
  .card.expired { opacity: .65; border-style: dashed; }
  .thumb { aspect-ratio: 16 / 10; background: #262626; position: relative; overflow: hidden; flex: none; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 8px; left: 8px; background: #121212; color: #e8873f;
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid #e8873f;
  }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
  .price { font-weight: 600; font-size: 16px; color: #e8873f; }
  .title {
    font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em;
  }
  .empty { text-align: center; color: #a0a0a0; padding: 60px 0; line-height: 1.6; }
</style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h2>Filters</h2>

      <div class="side-h">Status</div>
      <label class="opt on"><input type="radio" name="status" value="all" checked /> <span id="lblAll">Alles</span></label>
      <label class="opt"><input type="radio" name="status" value="active" /> <span id="lblActive">Actief</span></label>
      <label class="opt"><input type="radio" name="status" value="expired" /> <span id="lblExpired">Verlopen</span></label>

      <div class="side-h">Sorteren</div>
      <select id="sort" class="field" aria-label="Sorteren">
        <option value="recent">Nieuwst opgeslagen</option>
        <option value="oldest">Oudst opgeslagen</option>
        <option value="title">Titel A-Z</option>
        <option value="priceAsc">Prijs laag naar hoog</option>
        <option value="priceDesc">Prijs hoog naar laag</option>
      </select>

      <div class="side-h">Prijs</div>
      <div class="range">
        <input id="minPrice" class="field" type="number" min="0" inputmode="numeric" placeholder="Vanaf" aria-label="Prijs vanaf" />
        <input id="maxPrice" class="field" type="number" min="0" inputmode="numeric" placeholder="Tot" aria-label="Prijs tot" />
      </div>

      <button id="syncBtn" class="primary">Synchroniseer</button>
      <button id="clearBtn" class="secondary">Wis lijst</button>
    </aside>

    <main class="main">
      <div class="top">
        <h1>Mijn favorieten</h1>
        <input id="search" class="field" type="search" placeholder="Zoeken" aria-label="Zoek in je favorieten" />
      </div>
      <div class="meta" id="meta" aria-live="polite"></div>

      <section id="activeSection">
        <div class="section-h">Actief <span class="cnt" id="activeCount">0</span></div>
        <div class="grid" id="activeGrid" style="margin-top:14px"></div>
      </section>

      <section id="expiredSection">
        <div class="section-h expired">
          Verlopen <span class="cnt" id="expiredCount">0</span>
          <button id="cleanBtn" class="outline">Verwijder verlopen favorieten</button>
        </div>
        <div class="grid" id="expiredGrid" style="margin-top:14px"></div>
      </section>

      <div class="empty" id="empty" hidden></div>
    </main>
  </div>
  <script src="favorites.js"></script>
</body>
</html>
